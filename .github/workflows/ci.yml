name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q visionops tests
      - name: Lint
        run: ruff check visionops tests
      - name: Test
        run: pytest -q

  optional-backend:
    name: Optional backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: keras
            extras: keras
            import_module: visionops.KerasTrainer
          - backend: torch
            extras: torch,image
            import_module: visionops.PLTrainingUtils

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.extras }}]"
      - name: Import backend adapter
        env:
          VISIONOPS_BACKEND_MODULE: ${{ matrix.import_module }}
        run: python -c 'import importlib, os; importlib.import_module(os.environ["VISIONOPS_BACKEND_MODULE"])'
      - name: Test Keras tensor metrics
        if: matrix.backend == 'keras'
        run: python -c 'import tensorflow as tf; from visionops import TaskSpec, compute_metrics; result = compute_metrics(tf.constant([0, 1]), tf.constant([[-1.0], [1.0]]), TaskSpec(task_type="bc", num_classes=2)); assert "accuracy" in result'
      - name: Test Torch integrations
        if: matrix.backend == 'torch'
        run: pytest -q tests/test_pl_training_utils.py tests/test_torch_cam_hardening.py tests/test_smoke_training_eval_artifacts.py

  package:
    runs-on: ubuntu-latest
    needs: [test, optional-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Test the installed wheel
        run: |
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m venv /tmp/visionops-wheel-venv
          /tmp/visionops-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/visionops-wheel-venv/bin/python -m pip install "$wheel_path" "pytest>=8,<9"
          cd /tmp
          /tmp/visionops-wheel-venv/bin/python -c 'import importlib.metadata as metadata, os; from pathlib import Path; import visionops; package_file = Path(visionops.__file__).resolve(); assert not package_file.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve()); assert metadata.version("visionops-toolkit") == visionops.__version__; print(package_file)'
          /tmp/visionops-wheel-venv/bin/python -m pytest -q -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/tests"
