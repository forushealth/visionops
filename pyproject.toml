[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionops-toolkit"
version = "0.1.1"
description = "Modular MLOps utilities for computer-vision training, evaluation, explainability, and runtime diagnostics."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "VisionOps contributors" },
]
keywords = [
  "computer-vision",
  "evaluation",
  "explainability",
  "keras",
  "mlops",
  "pytorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=1.5,<3",
  "pillow>=9.5,<12",
  "pydantic>=2.5,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.2,<2",
  "scipy>=1.10,<2",
  "seaborn>=0.13,<1",
]

[project.urls]
Repository = "https://github.com/forushealth/forushealth"
Issues = "https://github.com/forushealth/forushealth/issues"

[project.optional-dependencies]
image = [
  "albumentations>=1.3,<3",
  "opencv-python>=4.8,<5",
]
keras = [
  "tensorflow>=2.13,<2.19",
]
torch = [
  "pytorch-lightning>=2.2,<3",
  "torch>=2.2,<3",
  "torchmetrics>=1.3,<2",
  "torchvision>=0.17,<1",
]
tracking = [
  "mlflow>=2.11,<3",
]
notebook = [
  "ipython>=8,<10",
  "jupyter-client>=8,<9",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "twine>=6,<7",
]
all = [
  "albumentations>=1.3,<3",
  "ipython>=8,<10",
  "jupyter-client>=8,<9",
  "mlflow>=2.11,<3",
  "opencv-python>=4.8,<5",
  "pytorch-lightning>=2.2,<3",
  "tensorflow>=2.13,<2.19",
  "torch>=2.2,<3",
  "torchmetrics>=1.3,<2",
  "torchvision>=0.17,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["visionops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["build", "dist"]

[tool.ruff.lint]
# Keep CI focused on syntax, Pyflakes correctness, bare exceptions, and common
# bug patterns. Broader style modernization can proceed incrementally.
select = ["E9", "E722", "F", "B"]
